name: Backend CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Fix Docker permissions for Testcontainers
        run: sudo chmod 666 /var/run/docker.sock

      - name: Start PostgreSQL for Tests
        run: |
          docker run -d --name test-postgres \
            -e POSTGRES_DB=subscriptions \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -p 5433:5432 postgres:18
            
          sleep 5

      - name: Build and Run Tests
        run: |
          cd backend
          mvn clean verify
          
      - name: Stop PostgreSQL
        if: always()
        run: docker stop test-postgres

      - name: Build and Run Tests
        run: |
          cd backend
          mvn clean verify

      - name: Test Docker Build
        run: |
          cd backend
          docker build -t subscriptiontracker-test .