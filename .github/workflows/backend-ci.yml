name: Backend CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Fix Docker permissions for Testcontainers
        run: sudo chmod 666 /var/run/docker.sock

      - name: Build and Run Tests
        env:
          JWT_SECRET: "1234567890123456789012345678901234567890123456789012345678901234"
        run: |
          cd backend
          mvn clean verify

      - name: Test Docker Build
        run: |
          cd backend
          docker build -t subscriptiontracker-test .
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Поиск секретов (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Сканирование зависимостей и Dockerfile (trivy)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        with:
          version: v0.69.3
          scan-type: fs
          scan-ref: backend
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true