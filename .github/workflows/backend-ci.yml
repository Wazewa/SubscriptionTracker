name: Backend CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Fix Docker permissions for Testcontainers
        run: sudo chmod 666 /var/run/docker.sock

      - name: Build and Run Tests
        env:
          JWT_SECRET: "1234567890123456789012345678901234567890123456789012345678901234"
        run: |
          cd backend
          mvn clean verify
          
      - name: Stop PostgreSQL
        if: always()
        run: docker stop test-postgres

      - name: Test Docker Build
        run: |
          cd backend
          docker build -t subscriptiontracker-test .