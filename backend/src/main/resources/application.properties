spring.application.name=SubscriptionTracker

spring.config.import=optional:file:../.env[.properties]

server.port=8080

vk.client-id=${VK_CLIENT_ID:}
vk.redirect-uri=${VK_REDIRECT_URI:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.locations=classpath:/db/migration
spring.flyway.baseline-on-migrate=true

jwt.secret=${JWT_SECRET}
jwt.access-ttl-seconds=${JWT_ACCESS_TTL:900}

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.level.ru.ivt.subscriptiontracker=INFO

telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
notifications.cron=0 0 9 * * *

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

rate-limit.auth-per-minute=${RATE_LIMIT_AUTH_PER_MINUTE:10}
rate-limit.api-per-minute=${RATE_LIMIT_API_PER_MINUTE:120}

server.forward-headers-strategy=native